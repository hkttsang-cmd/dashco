<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09111f">
<title>小西灣 Dashboard iOS12</title>
<style>
body{margin:0;background:#07101d;color:#f6fbff;font-family:-apple-system,sans-serif}
.main{display:flex;height:100vh;padding:10px;box-sizing:border-box}
.left{width:32%;background:#12243b;border-radius:16px;padding:20px;text-align:center}
.right{flex:1;padding-left:10px;overflow:auto}
.clock{font-size:72px;font-weight:bold}.seconds{font-size:28px;color:#65dcff}
.temp{font-size:72px;color:#ffd66b}.route-card{background:#14243a;margin-bottom:10px;border-radius:12px;padding:10px}
.route{font-size:40px;color:#65dcff;font-weight:bold}.time{display:inline-block;margin:5px;padding:8px 12px;background:#0b1726;border-radius:8px;font-size:28px}
.refresh-btn{position:fixed;top:20px;left:20px;width:56px;height:56px;border-radius:50%}
</style>
</head>
<body>
<button class="refresh-btn" id="refreshBtn">↻</button>
<div class="main">
<div class="left">
<div class="clock"><span id="clock">--:--</span><span class="seconds" id="seconds">:--</span></div>
<div id="date">載入中</div>
<div id="weatherIcon">🌤️</div>
<div>香港島・小西灣</div>
<div class="temp" id="temperature">--°</div>
<div id="humidity">濕度 --%</div>
<div id="weatherStatus">正在更新天氣</div>
<div id="updated">巴士資料載入中</div>
</div>
<div class="right" id="routes"></div>
</div>
<script>
window.onerror=function(m,s,l){document.getElementById('updated').innerHTML='JS Error: '+m+' line '+l;return true;};
var ROUTES=['788','789','8P','82','85','82X'];
var API='https://rt.data.gov.hk/v2/transport/citybus';
var routeStopCache={};
function $(id){return document.getElementById(id);} 
function pad(v){return v<10?'0'+v:v;}
function tick(){var n=new Date();$('clock').innerHTML=pad(n.getHours())+':'+pad(n.getMinutes());$('seconds').innerHTML=':'+pad(n.getSeconds());$('date').innerHTML=(n.getMonth()+1)+'/'+n.getDate();}
function card(r){return '<div class="route-card" id="card-'+r+'"><div class="route">'+r+'</div><div class="dest">藍灣半島開出</div><div><span class="time">--:--</span><span class="time">--:--</span><span class="time">--:--</span></div><div class="status">載入中</div></div>';}
function initCards(){var h='';for(var i=0;i<ROUTES.length;i++){h+=card(ROUTES[i]);}$('routes').innerHTML=h;}
async function json(u){var r=await fetch(u);return await r.json();}
async function firstOutboundStop(route){if(routeStopCache[route])return routeStopCache[route];var d=await json(API+'/route-stop/CTB/'+encodeURIComponent(route)+'/outbound');var first=d.data[0];routeStopCache[route]={stop:first.stop,dir:first.dir||'O'};return routeStopCache[route];}
function timeText(v){var d=new Date(v);return pad(d.getHours())+':'+pad(d.getMinutes());}
async function loadOneRoute(route){try{var el=$('card-'+route);var boxes=Array.prototype.slice.call(el.querySelectorAll('.time'));var first=await firstOutboundStop(route);var d=await json(API+'/eta/CTB/'+first.stop+'/'+route);var rows=d.data||[];var times=[];for(var i=0;i<rows.length;i++){if(rows[i].eta){var t=timeText(rows[i].eta);if(times.indexOf(t)<0)times.push(t);}if(times.length>=3)break;}while(times.length<3)times.push('--:--');for(i=0;i<3;i++)boxes[i].innerHTML=times[i];var dest='';if(rows.length&&rows[0]&&rows[0].dest_tc)dest=rows[0].dest_tc;if(dest)el.querySelector('.dest').innerHTML='往 '+dest;el.querySelector('.status').innerHTML='實際開出時間';}catch(e){}}
async function loadBus(){for(var i=0;i<ROUTES.length;i++){await loadOneRoute(ROUTES[i]);}$('updated').innerHTML='更新 '+new Date().toLocaleTimeString();}
async function loadWeather(){try{var d=await json('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');if(d.temperature&&d.temperature.data)$('temperature').innerHTML=d.temperature.data[0].value+'°';if(d.humidity&&d.humidity.data)$('humidity').innerHTML='濕度 '+d.humidity.data[0].value+'%';$('weatherStatus').innerHTML='香港天文台';}catch(e){$('weatherStatus').innerHTML='天氣讀取失敗';}}
async function refreshAll(){await loadWeather();await loadBus();}
$('refreshBtn').addEventListener('click',refreshAll);
initCards();tick();loadWeather();loadBus();setInterval(tick,1000);setInterval(loadBus,60000);setInterval(loadWeather,600000);
</script>
</body></html>
