<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小西灣 Dashboard iOS12</title>
<style>
body{margin:0;background:#07101d;color:#fff;font-family:-apple-system,sans-serif;height:100vh;overflow:hidden}
.refresh-btn{position:fixed;top:15px;left:15px;width:54px;height:54px;border-radius:50%;z-index:99}
.main{display:grid;grid-template-columns:30% 35% 35%;height:100vh;padding:10px;box-sizing:border-box;gap:10px}
.panel{background:#12243b;border-radius:12px;padding:15px;overflow:auto}
.clock{font-size:72px;font-weight:bold}.temp{font-size:72px;color:#ffd66b}
.route-card{background:#14243a;border-radius:10px;padding:10px;margin-bottom:10px}.route{font-size:38px;color:#65dcff;font-weight:bold}
.time{display:block;font-size:30px;margin:4px 0}.first{color:#8ff0ba;font-weight:bold}
</style>
</head><body>
<button class="refresh-btn" id="refreshBtn">↻</button>
<div class="main">
<div class="panel">
<div class="clock" id="clock">--:--</div>
<div id="date"></div><div id="weatherIcon">🌤️</div>
<div>香港島．小西灣</div><div class="temp" id="temperature">--°</div>
<div id="humidity">濕度 --%</div><div id="weatherStatus">載入中</div><div id="updated"></div>
</div>
<div class="panel" id="leftRoutes"></div>
<div class="panel" id="rightRoutes"></div>
</div>
<script>
var LEFT=['788','789','8P'];
var RIGHT=['82','82X','85'];
var API='https://rt.data.gov.hk/v2/transport/citybus';
var cache={};
function $(i){return document.getElementById(i);} function pad(v){return v<10?'0'+v:v;}
function tick(){var d=new Date();$('clock').innerHTML=pad(d.getHours())+':'+pad(d.getMinutes());$('date').innerHTML=(d.getMonth()+1)+'/'+d.getDate();}
async function j(u){var r=await fetch(u);return await r.json();}
function make(route){return '<div class="route-card" id="r'+route+'"><div class="route">'+route+'</div><div class="dest">藍灣半島開出</div><div class="t"></div></div>';}
function init(){var h='';for(var i=0;i<LEFT.length;i++)h+=make(LEFT[i]);$('leftRoutes').innerHTML=h;h='';for(i=0;i<RIGHT.length;i++)h+=make(RIGHT[i]);$('rightRoutes').innerHTML=h;}
async function stop(route){if(cache[route])return cache[route];var d=await j(API+'/route-stop/CTB/'+route+'/outbound');cache[route]=d.data[0];return cache[route];}
function tt(v){var d=new Date(v);return pad(d.getHours())+':'+pad(d.getMinutes());}
async function loadRoute(route){try{var s=await stop(route);var d=await j(API+'/eta/CTB/'+s.stop+'/'+route);var rows=(d.data||[]).filter(function(x){return x.eta && x.dir===s.dir && x.seq===1;});var u=[];for(var i=0;i<rows.length;i++){var t=tt(rows[i].eta);if(u.indexOf(t)<0)u.push(t);if(u.length>=3)break;}var html='';if(u.length===0){html='<div class="time">未有服務</div>';}else{for(i=0;i<u.length;i++){html+='<div class="time '+(i===0?'first':'')+'">'+u[i]+'</div>';}}document.querySelector('#r'+route+' .t').innerHTML=html;}catch(e){}}
async function loadBus(){for(var a=0;a<LEFT.length;a++)await loadRoute(LEFT[a]);for(var b=0;b<RIGHT.length;b++)await loadRoute(RIGHT[b]);$('updated').innerHTML='更新 '+new Date().toLocaleTimeString();}
async function loadWeather(){try{var d=await j('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');$('temperature').innerHTML=d.temperature.data[0].value+'°';$('humidity').innerHTML='濕度 '+d.humidity.data[0].value+'%';$('weatherStatus').innerHTML='香港天文台';}catch(e){}}
$('refreshBtn').onclick=async function(){await loadWeather();await loadBus();};
init();tick();loadWeather();loadBus();setInterval(tick,1000);setInterval(loadBus,60000);
</script></body></html>
