<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#07101d">
<title>小西灣出門 Dashboard</title>
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#07101d;color:#f6fbff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","PingFang HK",Arial,sans-serif;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
#app{display:-webkit-flex;display:flex;width:100%;height:100%;padding:8px;gap:8px}
.column{height:100%;min-width:0;border:1px solid #27435f;border-radius:16px;background:#0e1b2d;overflow:hidden}
.info-column{width:30%;padding:18px 12px 12px;text-align:center;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;background:linear-gradient(160deg,#122943,#0b1728)}
.bus-column{width:35%;padding:8px;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;gap:8px}
.refresh-btn{position:fixed;top:14px;left:14px;z-index:20;width:52px;height:52px;border:1px solid #5c86aa;border-radius:50%;background:#10263b;color:#fff;font-size:30px;line-height:48px;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.4);-webkit-tap-highlight-color:transparent}.refresh-btn:active{background:#214766;-webkit-transform:scale(.94);transform:scale(.94)}
.clock-row{white-space:nowrap;line-height:1}.clock{font-size:76px;font-weight:800;letter-spacing:-4px}.seconds{font-size:28px;color:#65dcff;font-weight:700}.date{margin-top:9px;font-size:20px;color:#b9c9da}
.weather-icon{font-size:64px;line-height:1;margin-top:22px}.weather-desc{font-size:27px;font-weight:750;margin-top:7px}.place{font-size:20px;color:#cfe3f4;margin-top:8px}.temperature{font-size:76px;line-height:1.08;font-weight:850;color:#ffd66b;margin-top:7px}.humidity{font-size:22px;margin-top:4px}.weather-source{font-size:14px;color:#91a6bb;margin-top:8px}
.update-box{width:100%;margin-top:16px;padding-top:12px;border-top:1px solid #31516e;color:#9fb3c7;font-size:14px;line-height:1.55}.live-now{color:#d9e8f4}.bus-updated{color:#8ff0ba}.error{color:#ffaaaa}
.route-card{height:33.333%;min-height:0;padding:8px 10px;border:1px solid #294966;border-radius:13px;background:#14243a;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-justify-content:center;justify-content:center}
.route-head{display:-webkit-flex;display:flex;-webkit-align-items:flex-end;align-items:flex-end;-webkit-justify-content:space-between;justify-content:space-between;margin-bottom:5px}.route{font-size:43px;line-height:1;font-weight:900;color:#65dcff}.dest{max-width:65%;font-size:13px;color:#a9bdd0;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.times{display:-webkit-flex;display:flex;width:100%;gap:6px}.time{width:33.333%;height:55px;border:1px solid #315473;border-radius:10px;background:#0a1726;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;font-size:29px;font-weight:800;letter-spacing:-1px}.time.first{color:#8ff0ba;border-color:#438966;background:#0c211c}.service-message{height:55px;border:1px solid #315473;border-radius:10px;background:#0a1726;color:#aabacc;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;font-size:21px;font-weight:700}.route-status{margin-top:5px;font-size:11px;color:#8198ad;text-align:right}
@media screen and (max-width:800px){#app{padding:5px;gap:5px}.column{border-radius:12px}.info-column{width:30%;padding:12px 7px}.bus-column{width:35%;padding:5px;gap:5px}.refresh-btn{top:9px;left:9px;width:46px;height:46px;font-size:27px;line-height:42px}.clock{font-size:62px}.seconds{font-size:23px}.date{font-size:17px}.weather-icon{font-size:52px;margin-top:15px}.weather-desc{font-size:22px}.place{font-size:16px}.temperature{font-size:64px}.humidity{font-size:18px}.weather-source,.update-box{font-size:12px}.route-card{padding:6px 7px;border-radius:10px}.route{font-size:36px}.dest{font-size:11px}.time{height:48px;font-size:25px}.service-message{height:48px;font-size:18px}.route-status{font-size:10px}}
</style>
</head>
<body>
<button id="refreshBtn" class="refresh-btn" type="button" aria-label="重新整理">↻</button>
<div id="app">
  <section class="column info-column">
    <div class="clock-row"><span id="clock" class="clock">--:--</span><span id="seconds" class="seconds">:--</span></div>
    <div id="date" class="date">載入中</div>
    <div id="weatherIcon" class="weather-icon">🌤️</div>
    <div id="weatherDesc" class="weather-desc">正在讀取天氣</div>
    <div class="place">香港島・小西灣</div>
    <div id="temperature" class="temperature">--°</div>
    <div id="humidity" class="humidity">濕度 --%</div>
    <div id="weatherSource" class="weather-source">香港天文台即時資料</div>
    <div class="update-box">
      <div id="liveNow" class="live-now">現在時間 --:--:--</div>
      <div id="busUpdated" class="bus-updated">巴士資料載入中</div>
      <div id="weatherUpdated">天氣資料載入中</div>
    </div>
  </section>
  <section id="routesA" class="column bus-column"></section>
  <section id="routesB" class="column bus-column"></section>
</div>
<script>
(function(){
'use strict';
var ROUTES_A=['788','789','8P'];
var ROUTES_B=['82','82X','85'];
var API='https://rt.data.gov.hk/v2/transport/citybus';
var stopCache={};
var pending=0;
function el(id){return document.getElementById(id)}
function pad(n){return n<10?'0'+n:String(n)}
function hms(d){return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())}
function hm(d){return pad(d.getHours())+':'+pad(d.getMinutes())}
function tick(){var d=new Date();el('clock').innerHTML=hm(d);el('seconds').innerHTML=':'+pad(d.getSeconds());el('date').innerHTML=(d.getMonth()+1)+'月'+d.getDate()+'日　星期'+'日一二三四五六'.charAt(d.getDay());el('liveNow').innerHTML='現在時間 '+hms(d)}
function requestJSON(url,done,fail){var x=new XMLHttpRequest();x.open('GET',url,true);x.timeout=15000;x.onreadystatechange=function(){if(x.readyState===4){if(x.status>=200&&x.status<300){try{done(JSON.parse(x.responseText))}catch(e){fail('資料格式錯誤')}}else{fail('HTTP '+x.status)}}};x.ontimeout=function(){fail('連線逾時')};x.onerror=function(){fail('網絡錯誤')};x.send(null)}
function routeCard(route){return '<article class="route-card" id="route-'+route+'"><div class="route-head"><div class="route">'+route+'</div><div class="dest">藍灣半島開出</div></div><div class="times"><div class="time first">--:--</div><div class="time">--:--</div><div class="time">--:--</div></div><div class="route-status">載入中</div></article>'}
function fillColumn(id,routes){var out='';for(var i=0;i<routes.length;i++){out+=routeCard(routes[i])}el(id).innerHTML=out}
function contains(arr,n){for(var i=0;i<arr.length;i++){if(arr[i]===n)return true}return false}
function weatherInfo(icon){icon=Number(icon);if(icon===50||icon===51)return['☀️','天晴'];if(icon===52||icon===53)return['🌤️','短暫陽光'];if(icon===54)return['🌥️','間中有陽光'];if(icon===60||icon===61)return['☁️','多雲'];if(icon===62)return['☁️','密雲'];if(icon===63||icon===64)return['🌧️','有雨'];if(icon===65)return['⛈️','雷雨'];if(icon>=70&&icon<=77)return['🌧️','有雨'];if(icon===80||icon===81||icon===82)return['🌬️','大風'];if(icon===83||icon===84)return['🌫️','有霧'];if(icon===85)return['🌙','天晴'];if(icon===90||icon===91)return['🌙','乾燥'];return['🌤️','即時天氣']}
function findTemp(data){var list=data&&data.temperature&&data.temperature.data?data.temperature.data:[];var first=list.length?list[0]:null;for(var i=0;i<list.length;i++){var p=list[i].place||'';if(p.indexOf('筲箕灣')>=0||p.indexOf('柴灣')>=0){return list[i]}}return first}
function loadWeather(){requestJSON('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc',function(d){var t=findTemp(d);var wi=weatherInfo(d.icon&&d.icon.length?d.icon[0]:0);el('weatherIcon').innerHTML=wi[0];el('weatherDesc').innerHTML=wi[1];el('temperature').innerHTML=t?t.value+'°':'--°';if(d.humidity&&d.humidity.data&&d.humidity.data.length){el('humidity').innerHTML='濕度 '+d.humidity.data[0].value+'%'}el('weatherSource').innerHTML=t?'溫度站：'+t.place:'香港天文台即時資料';el('weatherUpdated').innerHTML='天氣更新 '+hms(new Date())},function(msg){el('weatherDesc').innerHTML='天氣讀取失敗';el('weatherSource').className='weather-source error';el('weatherSource').innerHTML=msg})}
function finishBusOne(){pending--;if(pending<=0){el('busUpdated').innerHTML='巴士更新 '+hms(new Date());var b=el('refreshBtn');b.disabled=false;b.innerHTML='↻'}}
function renderNoService(route,text){var card=el('route-'+route);card.querySelector('.times').innerHTML='<div class="service-message">'+text+'</div>';card.querySelector('.route-status').innerHTML='只顯示藍灣半島總站開出班次'}
function loadETA(route,first){requestJSON(API+'/eta/CTB/'+encodeURIComponent(first.stop)+'/'+encodeURIComponent(route),function(d){var rows=d&&d.data?d.data:[];var now=new Date().getTime()-60000;var valid=[];for(var i=0;i<rows.length;i++){var x=rows[i];if(x.eta&&x.seq===1&&(!x.dir||x.dir===first.dir)&&new Date(x.eta).getTime()>=now){valid.push(x)}}valid.sort(function(a,b){return new Date(a.eta).getTime()-new Date(b.eta).getTime()});var times=[];var dest='';for(i=0;i<valid.length;i++){var value=hm(new Date(valid[i].eta));if(!contains(times,value)){times.push(value)}if(!dest&&valid[i].dest_tc){dest=valid[i].dest_tc}if(times.length===3)break}var card=el('route-'+route);if(dest){card.querySelector('.dest').innerHTML='往 '+dest}if(times.length===0){renderNoService(route,'未有開出班次')}else{var boxes=card.querySelectorAll('.time');for(i=0;i<boxes.length;i++){boxes[i].innerHTML=times[i]||'--:--'}card.querySelector('.route-status').innerHTML='實際預計開出時間'}finishBusOne()},function(){renderNoService(route,'暫未能讀取');finishBusOne()})}
function loadRoute(route){if(stopCache[route]){loadETA(route,stopCache[route]);return}requestJSON(API+'/route-stop/CTB/'+encodeURIComponent(route)+'/outbound',function(d){var stops=d&&d.data?d.data:[];stops.sort(function(a,b){return Number(a.seq)-Number(b.seq)});if(!stops.length||!stops[0].stop){renderNoService(route,'暫未能讀取');finishBusOne();return}stopCache[route]={stop:stops[0].stop,dir:stops[0].dir||'O'};loadETA(route,stopCache[route])},function(){renderNoService(route,'暫未能讀取');finishBusOne()})}
function resetCard(route){var card=el('route-'+route);card.querySelector('.times').innerHTML='<div class="time first">--:--</div><div class="time">--:--</div><div class="time">--:--</div>';card.querySelector('.route-status').innerHTML='更新中'}
function loadBus(){var all=ROUTES_A.concat(ROUTES_B);pending=all.length;el('busUpdated').innerHTML='巴士資料更新中';for(var i=0;i<all.length;i++){resetCard(all[i]);loadRoute(all[i])}}
function refreshAll(){var b=el('refreshBtn');b.disabled=true;b.innerHTML='…';loadWeather();loadBus()}
window.onerror=function(msg,src,line){el('busUpdated').className='bus-updated error';el('busUpdated').innerHTML='程式錯誤 line '+line+': '+msg;return true};
fillColumn('routesA',ROUTES_A);fillColumn('routesB',ROUTES_B);tick();loadWeather();loadBus();el('refreshBtn').onclick=refreshAll;setInterval(tick,1000);setInterval(loadBus,60000);setInterval(loadWeather,600000);
})();
</script>
</body>
</html>
